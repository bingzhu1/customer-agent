[project]
name = "cs-agent"
version = "0.0.1"
description = "生产级客服 AI Agent：LLM 负责理解与提议，确定性代码负责判定与执行"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.60",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pyjwt>=2.9",
    "prometheus-client>=0.20",
    "langgraph>=0.2",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "structlog>=24.1",
    "langfuse>=3.0",
    # Phase 2 RAG：Anthropic 不提供 embedding 接口，向量化走 OpenAI text-embedding-3-small
    "openai>=1.40",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cs_agent"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["cs_agent"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
