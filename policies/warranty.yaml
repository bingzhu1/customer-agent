# 保修域策略（均为 informational，只用于 RAG 回答，不参与资格判定）。
# 结构与字段见 src/cs_agent/policy/schema.py；id/版本/要点以 docs/phase0-fixtures.md §5 为准。

- id: WARRANTY-STD-001
  version: 2
  effective_date: "2026-04-01"
  domain: warranty
  effect: informational
  anchor: "warranty#standard"
  title: 电子产品标准保修规则
  human_text: |
    电子产品自签收之日起享有 12 个月的保修服务，保修期内出现非人为原因的性能故障，可免费维修。
    自签收之日起 7 天内（含第 7 天）出现性能故障的，可以选择换新同型号商品，而不必等待维修。
    申请保修时请提供订单信息与故障描述，必要时提供照片或视频，由人工专员为您登记并安排检测。
  faq:
    - q: 电子产品保修多久？
      a: 电子产品自签收之日起保修 12 个月，保修期内的非人为性能故障可以免费维修。
    - q: 刚买几天就坏了，能换新的吗？
      a: 可以。签收 7 天内出现性能故障的，可以选择换新同型号商品，不必等待维修。
    - q: 保修怎么申请？
      a: 联系客服并提供订单信息、故障描述，必要时附照片或视频，人工专员会为您登记并安排检测。

- id: WARRANTY-EXCL-001
  version: 1
  effective_date: "2026-01-10"
  domain: warranty
  effect: informational
  anchor: "warranty#exclusions"
  title: 保修范围除外情形
  human_text: |
    以下情形不在保修范围内：一、因摔落、进水、挤压、使用不当等人为原因造成的损坏；二、未经授权自行拆解、改装或维修过的商品；三、正常使用产生的外观磨损。
    出现上述情形的，保修期内也无法享受免费维修或换新，但可以联系客服咨询付费维修。
    是否属于人为损坏由检测结果认定，如有争议可申请人工复核。
  faq:
    - q: 手机摔坏了保修吗？
      a: 不保。摔落、进水、挤压等人为原因造成的损坏不在保修范围内，可以咨询付费维修。
    - q: 我自己拆开修过，还能保修吗？
      a: 不能。未经授权自行拆解、改装或维修过的商品不在保修范围内。
    - q: 检测说是人为损坏，我不认可怎么办？
      a: 可以申请人工复核，是否属于人为损坏以检测结果为准，有争议由人工专员复核处理。
