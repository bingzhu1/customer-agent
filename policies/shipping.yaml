# 物流域策略（均为 informational，只用于 RAG 回答，不参与资格判定）。
# 结构与字段见 src/cs_agent/policy/schema.py；id/版本/要点以 docs/phase0-fixtures.md §5 为准。

- id: SHIP-DELAY-001
  version: 1
  effective_date: "2026-01-20"
  domain: shipping
  effect: informational
  anchor: "shipping#delay"
  title: 物流延误的催件与补偿规则
  human_text: |
    包裹实际送达时间超出订单页面显示的预计送达日期 3 天（含）以上的，您可以联系客服发起催件，我们会向承运商加急处理并同步最新进展。
    超出预计送达日期 7 天（含）以上仍未送达的，您可以申请延误补偿，具体补偿方案由人工专员根据订单情况核定。
    因天气、不可抗力等原因导致的延误，会在物流轨迹中标注，补偿规则可能有所不同。
  faq:
    - q: 快递比预计时间晚了，什么时候可以催？
      a: 超出预计送达日期 3 天及以上，就可以联系客服发起催件，我们会向承运商加急处理。
    - q: 包裹晚了一个多星期能要赔偿吗？
      a: 可以。超出预计送达日期 7 天及以上仍未送达的，可以申请延误补偿，具体方案由人工专员核定。
    - q: 催件之后多久有消息？
      a: 我们会向承运商加急处理并同步最新进展，具体时效以承运商反馈为准。

- id: SHIP-LOST-001
  version: 1
  effective_date: "2026-01-20"
  domain: shipping
  effect: informational
  anchor: "shipping#lost"
  title: 包裹丢件的认定与处理规则
  human_text: |
    包裹物流轨迹连续 15 天（含）无任何更新的，视为丢件。
    丢件订单会由人工专员为您核实并启动处理：可选择补发同款商品，或全额退款；补发缺货的按退款处理。
    在轨迹停止更新不足 15 天期间，我们会先按延误流程向承运商催查，请您耐心等待。
  faq:
    - q: 我的包裹好久没有物流更新了，是不是丢了？
      a: 物流轨迹连续 15 天以上没有更新的，视为丢件，会由人工专员为您核实处理；不足 15 天会先按延误催查。
    - q: 包裹丢了怎么赔？
      a: 丢件订单可以选择补发同款商品或全额退款，由人工专员为您办理；补发缺货的按退款处理。
    - q: 丢件的处理客服能直接办吗？
      a: 丢件需要人工专员核实后处理，客服会为您登记并转交人工跟进。
