# 投诉域策略（informational，只用于 RAG 回答，不参与资格判定）。
# 结构与字段见 src/cs_agent/policy/schema.py；id/版本/要点以 docs/phase0-fixtures.md §5 为准。

- id: COMPLAINT-SLA-001
  version: 1
  effective_date: "2026-02-15"
  domain: complaint
  effect: informational
  anchor: "complaint#sla"
  title: 投诉处理时效承诺
  human_text: |
    您提交的投诉会在 24 小时内得到首次响应，并在 72 小时内给出处理结论并结案。
    如处理过程中需要补充信息或涉及第三方核实，我们会在时限内主动告知您进展与预计完成时间。
    在任何环节，只要您提出希望由人工处理，我们都会立即为您转接人工客服，不需要满足其他条件。
  faq:
    - q: 我投诉了多久会有人理我？
      a: 投诉会在 24 小时内得到首次响应，并在 72 小时内给出处理结论。
    - q: 我不想跟机器人说，能直接找人吗？
      a: 可以。任何时候只要您提出要人工处理，我们都会立即为您转接人工客服。
    - q: 72 小时到了还没解决怎么办？
      a: 如需补充信息或第三方核实，我们会在时限内主动告知进展和预计完成时间；您也可以随时要求转人工跟进。
